name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -trimpath

jobs:
  build-test:
    name: go build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # The Go module lives in go/.
          working-directory: go
          # Match the pinned local tool version.
          version: v2.14
          install-mode: golangci-lint
          args: --issues-exit-code=1 --timeout 5m

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - run: nix flake check --print-build-logs

      - name: Build .#html-to-md for the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: nix build .#html-to-md --no-link
